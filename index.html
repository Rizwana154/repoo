<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simple E-Commerce</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            background-color: white;
            padding: 20px;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 2px 5px #ccc;
        }

        .product h3 {
            margin-top: 0;
        }

        .price {
            font-size: 20px;
            color: green;
            font-weight: bold;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .cart {
            background-color: white;
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .checkout {
            margin-top: 20px;
            background-color: green;
        }

        .checkout:hover {
            background-color: darkgreen;
        }
    </style>
</head>

<body>

    <header>
        <h1>My E-Commerce Store</h1>
    </header>

    <div class="container">

        <h2>Products</h2>

        <div class="products" id="products"></div>

        <div class="cart">

            <h2>🛒 Shopping Cart</h2>

            <div id="cart"></div>

            <h3>
                Total: ₹<span id="total">0</span>
            </h3>

            <button class="checkout" onclick="checkout()">
                Checkout
            </button>

        </div>

    </div>

    <script>

        // Products
        const products = [
            {
                id: 1,
                name: "T-Shirt",
                price: 500
            },
            {
                id: 2,
                name: "Shoes",
                price: 1500
            },
            {
                id: 3,
                name: "Watch",
                price: 2000
            },
            {
                id: 4,
                name: "Headphones",
                price: 1000
            }
        ];

        // Shopping cart
        let cart = [];


        // Display products
        function displayProducts() {

            const productsDiv = document.getElementById("products");

            productsDiv.innerHTML = "";

            products.forEach(product => {

                productsDiv.innerHTML += `
                    <div class="product">

                        <h3>${product.name}</h3>

                        <p class="price">
                            ₹${product.price}
                        </p>

                        <button onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>

                    </div>
                `;
            });
        }


        // Add product to cart
        function addToCart(productId) {

            const product = products.find(
                product => product.id === productId
            );

            cart.push(product);

            displayCart();
        }


        // Display cart
        function displayCart() {

            const cartDiv = document.getElementById("cart");

            cartDiv.innerHTML = "";

            let total = 0;


            if (cart.length === 0) {

                cartDiv.innerHTML = "<p>Your cart is empty.</p>";

            } else {

                cart.forEach((item, index) => {

                    cartDiv.innerHTML += `
                        <div class="cart-item">

                            <span>
                                ${item.name} - ₹${item.price}
                            </span>

                            <button onclick="removeFromCart(${index})">
                                Remove
                            </button>

                        </div>
                    `;

                    total += item.price;
                });
            }


            document.getElementById("total").innerText = total;
        }


        // Remove item
        function removeFromCart(index) {

            cart.splice(index, 1);

            displayCart();
        }


        // Checkout
        function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;
            }

            alert("🎉 Order placed successfully!");

            cart = [];

            displayCart();
        }


        // Start application
        displayProducts();

        displayCart();

    </script>

</body>
</html>
